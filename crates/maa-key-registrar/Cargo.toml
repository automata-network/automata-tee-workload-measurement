[package]
name = "maa-key-registrar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Off-chain registrar for the on-chain MaaKeyRegistry contract. Fetches MAA JWKS, derives upsert arguments, and submits upsertMaaSigningKey / revokeMaaSigningKey transactions."

[[bin]]
name = "maa-key-registrar"
path = "src/main.rs"

[dependencies]
alloy.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x509-parser.workspace = true
